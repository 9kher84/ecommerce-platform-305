version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sovereign_secure_pass}
      POSTGRES_DB: ${DB_DATABASE:-sovereign_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - sovereign_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - sovereign_network

  backend:
    build:
      context: ./backend
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SIGNATURE_KEY=${SIGNATURE_KEY}
      - OWNER_ID=${OWNER_ID}
      - OWNER_PANEL_ENABLED=true
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - sovereign_network

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - sovereign_network

  openclaw:
    image: openclaw/openclaw:latest
    ports:
      - "18789:18789"
    environment:
      - OPENCLAW_WEBHOOK_URL=http://backend:3000/api/agents/webhook
      - OPENCLAW_TOKEN=${OPENCLAW_TOKEN}
    volumes:
      - ./openclaw_data:/app/data
    restart: always
    networks:
      - sovereign_network

networks:
  sovereign_network:
    name: sovereign_network

volumes:
  postgres_data:
  redis_data:
