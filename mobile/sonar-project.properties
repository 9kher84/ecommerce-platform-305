# SonarQube Project Properties
sonar.projectKey=ecommerce-mobile-app
sonar.projectName=Ecommerce Mobile App
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Source directories
sonar.sources=src
sonar.tests=__tests__

# Exclusions (Tests, Mocks, Configs)
sonar.exclusions=**/__tests__/**, **/*.test.ts, **/*.spec.ts, android/**, ios/**, node_modules/**

# TypeScript Configuration
sonar.typescript.tsconfigPath=tsconfig.json

# Security & Quality Gates
sonar.qualitygate.wait=true
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Custom Rules for Mobile Security
# Ensure we scan for hardcoded secrets and insecure storage
sonar.issue.ignore.multicriteria=e1
# Ignore specific rules if needed (e.g., console.log in dev)
# sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S106
# sonar.issue.ignore.multicriteria.e1.resourceKey=src/**/*.ts
