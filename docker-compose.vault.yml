version: "3.8"

services:
  vault:
    image: vault:latest
    container_name: ecommerce-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root-token-123"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - vault-data:/vault/data
      - vault-logs:/vault/logs
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vault-data:
  vault-logs:

networks:
  ecommerce-network:
    driver: bridge
