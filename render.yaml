services:
  - type: redis
    name: ecommerce-redis-305
    ipAllowList: []

  - type: web
    name: ecommerce-backend-305
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: REDIS_HOST
        fromService:
          type: redis
          name: ecommerce-redis-305
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: ecommerce-redis-305
          property: port
      - key: JWT_SECRET
        generateValue: true
      - key: SIGNATURE_KEY
        generateValue: true
      - key: OWNER_BOOTSTRAP_ENABLED
        value: "false"
      - key: OWNER_ID
        sync: false
      - key: DB_ENCRYPTION_KEY
        sync: false

  - type: web
    name: ecommerce-frontend-305
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: ecommerce-backend-305
          property: host
