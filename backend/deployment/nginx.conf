# ecommerce-platform-backend Nginx Configuration
# Production Hardening Guide (Day 6)

# HTTP Block - Redirect all traffic to HTTPS
server {
    listen 80;
    server_name example.com www.example.com; # Replace with your domain

    # I.1) Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Block - Main Application
server {
    listen 443 ssl http2;
    server_name example.com www.example.com; # Replace with your domain

    # SSL Configuration (Placeholders - Use Certbot/Let's Encrypt in production)
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # I.2) Security Headers
    # HSTS: Force HTTPS for 1 year, include subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # Clickjacking protection
    add_header X-Frame-Options "DENY" always;
    
    # XSS Protection (blocks rendering if attack detected)
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Content Security Policy (Basic)
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; frame-ancestors 'none';" always;

    # Disable Server Tokens (Hide Nginx Version)
    server_tokens off;

    # Client Body Size Limit (Prevent DoS via large uploads)
    client_max_body_size 10M;

    # I.3) Protect Sensitive Files
    # Block access to .env, package.json, git, etc.
    location ~ /\.(env|git|svn|hg|cvs) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /(package\.json|package-lock\.json|yarn\.lock) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to deployment folder if exposed
    location ^~ /deployment/ {
        deny all;
        return 404;
    }

    # Proxy to Node.js Backend
    location / {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # I.3) Secure File Uploads (Internal mechanism example)
    # If using Nginx to serve static files, ensure 'uploads' does not execute scripts
    location /uploads/ {
        internal; # Only accessible via X-Accel-Redirect from backend
        alias /var/www/ecommerce-platform/backend/uploads/;
    }
}
